<!-- index.html - Updated with Firebase & Redirect -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Cafe VIP</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
    <ul class="bg-bubbles">
        <li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>

    <div class="glass-panel" style="margin-top: 15vh; text-align: center;">
        <h1 style="margin-bottom: 20px; color: #fff;">Welcome to Cafe!</h1>
        <p style="margin-bottom: 20px; font-size: 14px; color: #e0aaff;">Enter your details to unlock Games & Coupons</p>
        
        <form id="customerLoginForm">
            <input type="text" id="custName" class="input-field" placeholder="Enter Your Name" required>
            <input type="number" id="custMobile" class="input-field" placeholder="Enter Mobile Number" required>
            <button type="submit" id="cust-login-btn" class="btn-3d">Enter Dashboard 🚀</button>
        </form>
    </div>

    <!-- Firebase Config aur Customer Login Logic -->
    <script src="firebase-config.js"></script>
    <script src="customer-login.js"></script>
</body>
</html>
