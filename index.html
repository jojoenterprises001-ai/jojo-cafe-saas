<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jojo Cafe SaaS - Smart QR Menu</title>
    <!-- Tailwind CSS (Modern Design ke liye) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header / Branding Section -->
    <div class="text-center mb-10">
        <h1 class="text-5xl font-extrabold text-blue-600 mb-2 tracking-tight">Jojo Cafe SaaS</h1>
        <p class="text-gray-600 font-medium">Smart QR Menu & Hack-Proof Loyalty Platform</p>
    </div>

    <!-- Main Buttons -->
    <div class="space-y-4 w-full max-w-sm">
        <button onclick="window.location.href='super-admin.html'" class="w-full bg-red-600 text-white font-bold py-3.5 rounded-xl shadow-md hover:bg-red-700 transition transform hover:scale-105">
            Super Admin Login
        </button>

        <button onclick="window.location.href='owner-login.html'" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-md hover:bg-blue-700 transition transform hover:scale-105">
            Cafe Owner Login
        </button>

        <button onclick="openModal()" class="w-full bg-green-600 text-white font-bold py-3.5 rounded-xl shadow-md hover:bg-green-700 transition transform hover:scale-105">
            New Cafe Registration
        </button>
    </div>

    <!-- Registration Modal Popup -->
    <div id="regModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md transform transition-all">
            
            <!-- Form Section -->
            <div id="formSection">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Register New Cafe</h2>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 font-bold text-3xl leading-none transition">&times;</button>
                </div>
                
                <!-- Yahan pehle se theek kiya hua Form Code hai -->
                <form id="cafeForm" class="space-y-4">
                    <input type="text" id="cafeName" placeholder="Cafe Name (e.g., Sharma Dhaba)" required class="w-full border-2 border-gray-200 p-3 rounded-lg text-black focus:border-blue-500 focus:outline-none transition" />
                    <input type="text" id="ownerName" placeholder="Owner Name" required class="w-full border-2 border-gray-200 p-3 rounded-lg text-black focus:border-blue-500 focus:outline-none transition" />
                    <input type="tel" id="mobile" placeholder="Mobile Number" required class="w-full border-2 border-gray-200 p-3 rounded-lg text-black focus:border-blue-500 focus:outline-none transition" />
                    <input type="password" id="password" placeholder="Create Password" required class="w-full border-2 border-gray-200 p-3 rounded-lg text-black focus:border-blue-500 focus:outline-none transition" />
                    
                    <button type="submit" class="w-full bg-green-600 text-white font-bold py-3.5 rounded-lg hover:bg-green-700 transition shadow-lg mt-2">
                        Submit Details
                    </button>
                </form>
            </div>

            <!-- Success Section -->
            <div id="successSection" class="hidden text-center space-y-4 py-6">
                <div class="text-6xl animate-bounce">✅</div>
                <h2 class="text-2xl font-bold text-green-600">Account Created!</h2>
                <p class="text-gray-600 text-sm px-2">
                    Aapka account ban gaya hai. Apna panel activate karne ke liye Super Admin ko WhatsApp par request bhejein.
                </p>
                <button onclick="sendWhatsAppRequest()" class="w-full bg-[#25D366] text-white font-bold py-3.5 rounded-lg shadow-lg flex justify-center items-center gap-2 hover:bg-[#20b858] transition">
                    Send Activation Request
                </button>
            </div>

        </div>
    </div>

    <!-- UI Handle karne ka JavaScript -->
    <script>
        function openModal() {
            document.getElementById('regModal').classList.remove('hidden');
            document.getElementById('formSection').classList.remove('hidden');
            document.getElementById('successSection').classList.add('hidden');
            document.getElementById('cafeForm').reset();
        }

        function closeModal() {
            document.getElementById('regModal').classList.add('hidden');
        }

        function sendWhatsAppRequest() {
            const cafeName = document.getElementById('cafeName').value;
            const adminNumber = "917689874945";
            const message = `Hello Admin, I have registered a new cafe *${cafeName}*. Please activate my panel.`;
            const whatsappLink = `https://wa.me/${adminNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappLink, "_blank");
            closeModal();
        }
    </script>

    <!-- Tumhara Firebase Registration Engine yahan link ho gaya hai -->
    <script type="module" src="register-db.js"></script>

</body>
</html>
