<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jojo Cafe - Menu</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <h2 id="cafeNameTop">☕ Jojo Cafe</h2>
    <p id="welcomeText">Hi!</p>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" onclick="openLoyalty()">🎁</button>
    <button class="icon-btn" onclick="openLeaderboard()">🏆</button>
    <button class="icon-btn" onclick="openCart()">
      🛒 <span id="cartCount">0</span>
    </button>
  </div>
</div>

<div class="tabs-row">
  <button class="tab-chip active" onclick="switchView('menu')">🍽️ Menu</button>
  <button class="tab-chip" onclick="switchView('games')">🎮 Games</button>
</div>

<div id="menuView">
  <div id="menuContainer" class="menu-grid">
    <p style="text-align:center; width:100%; color:#999;">Loading menu...</p>
  </div>
</div>

<div id="gamesView" style="display:none;">
  <div class="games-grid">
    <div class="game-card" onclick="window.location.href='games.html?game=spin'">
      <div class="game-icon">🎡</div>
      <p>Spin the Wheel</p>
    </div>
    <div class="game-card" onclick="window.location.href='games.html?game=tictactoe'">
      <div class="game-icon">⭕</div>
      <p>Tic-Tac-Toe</p>
    </div>
    <div class="game-card" onclick="window.location.href='games.html?game=memory'">
      <div class="game-icon">🃏</div>
      <p>Memory Flip</p>
    </div>
    <div class="game-card" onclick="window.location.href='games.html?game=quiz'">
      <div class="game-icon">🧠</div>
      <p>GK Quiz</p>
    </div>
  </div>
</div>

<!-- Cart Modal -->
<div id="cartModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Your Cart</h3>
      <span class="close-btn" onclick="closeCart()">✕</span>
    </div>
    <div id="cartItemsList"></div>
    <div class="bill-total">
      <span>Total</span>
      <span id="cartTotal">₹0</span>
    </div>
    <button class="place-order-btn" onclick="placeOrder()">📲 Place Order via WhatsApp</button>
  </div>
</div>

<!-- Loyalty Modal -->
<div id="loyaltyModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Loyalty Card</h3>
      <span class="close-btn" onclick="closeLoyalty()">✕</span>
    </div>
    <p style="text-align:center; color:#888; margin-bottom:15px;">Collect 7 ticks, get ₹150 off!</p>
    <div class="ticks-grid" id="ticksGrid"></div>
    <div id="couponBox" style="display:none; text-align:center; margin-top:15px; padding:15px; background:#e8f9ee; border-radius:12px;">
      <p style="font-weight:bold; color:#27ae60; margin-bottom:5px;">🎉 Coupon Unlocked!</p>
      <p style="font-size:20px; font-weight:bold; letter-spacing:2px; color:#333;" id="couponCodeText"></p>
      <p style="font-size:12px; color:#888; margin-top:5px;">Show this code to the cafe owner</p>
    </div>
  </div>
</div>

<!-- Leaderboard Modal -->
<div id="leaderboardModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3>🏆 Leaderboard</h3>
      <span class="close-btn" onclick="closeLeaderboard()">✕</span>
    </div>
    <div id="leaderboardList"></div>
  </div>
</div>

<!-- 3D Item Popup -->
<div id="photo3DOverlay" class="photo-3d-overlay">
  <div class="photo-3d-box">
    <img id="popup3DImg" src="">
    <h3 id="popup3DName"></h3>
    <p class="price-3d" id="popup3DPrice"></p>
    <button class="place-order-btn" style="background:#ff7e5f;" onclick="addFromPopup()">Add to Cart +</button>
    <p style="margin-top:10px; color:#999; font-size:13px; cursor:pointer;" onclick="close3DPopup()">Cancel</p>
  </div>
</div>

<!-- 3D Fly Animation Layer -->
<div id="flyLayer"></div>

<!-- Order Success Toast -->
<div id="toast" class="toast"></div>

<script src="dashboard-logic.js"></script>
<script src="cart-animation.js"></script>
  <!-- 3D VIP Liquid Glow Background -->
<div class="bg-animation">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
</div>
  
</body>

  
</html>
