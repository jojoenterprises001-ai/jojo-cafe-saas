<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jojo Cafe - Menu</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <h2>☕ Jojo Cafe</h2>
    <p id="welcomeText">Hi!</p>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" onclick="openLoyalty()">🎁</button>
    <button class="icon-btn" onclick="openCart()">
      🛒 <span id="cartCount">0</span>
    </button>
  </div>
</div>

<div id="menuContainer" class="menu-grid">
  <p style="text-align:center; width:100%; color:#999;">Loading menu...</p>
</div>

<!-- Cart Modal -->
<div id="cartModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Your Cart</h3>
      <span class="close-btn" onclick="closeCart()">✕</span>
    </div>
    <div id="cartItemsList"></div>
    <div class="bill-total">
      <span>Total</span>
      <span id="cartTotal">₹0</span>
    </div>
    <button class="place-order-btn" onclick="placeOrder()">Place Order</button>
  </div>
</div>

<!-- Loyalty Modal -->
<div id="loyaltyModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Loyalty Card</h3>
      <span class="close-btn" onclick="closeLoyalty()">✕</span>
    </div>
    <p style="text-align:center; color:#888; margin-bottom:15px;">Collect 7 ticks, get a free reward!</p>
    <div class="ticks-grid" id="ticksGrid"></div>
    <p id="couponMsg" style="text-align:center; color:green; font-weight:bold; margin-top:15px; display:none;">
      🎉 Coupon Unlocked! Show this screen to the owner.
    </p>
  </div>
</div>

<!-- Order Success Toast -->
<div id="toast" class="toast"></div>

<script src="dashboard-logic.js"></script>
<script src="cart-animation.js"></script>
</body>
</html>
