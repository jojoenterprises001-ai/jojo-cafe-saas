<!-- owner-dashboard.html - Updated with Firebase -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Owner Dashboard</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
    <ul class="bg-bubbles">
        <li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>

    <div class="glass-panel" style="margin-top: 5vh;">
        <h1 style="text-align: center; color: #fff; margin-bottom: 20px;">🏪 Owner Dashboard</h1>
        
        <!-- Section 1: Give Ticks -->
        <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; margin-bottom: 20px;">
            <h3 style="color: #e0aaff; margin-bottom: 10px;">✅ Give Loyalty Tick</h3>
            <p style="font-size: 12px; color: #ccc; margin-bottom: 10px;">For orders above ₹299.</p>
            <input type="number" id="customer-phone-tick" class="input-field" placeholder="Customer Mobile Number" required>
            <button class="btn-3d" id="tick-btn" onclick="giveTick()" style="background: linear-gradient(145deg, #25D366, #128C7E);">
                Add 1 Tick ➔
            </button>
        </div>

        <!-- Section 2: Redeem Coupon -->
        <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; margin-bottom: 20px;">
            <h3 style="color: #e0aaff; margin-bottom: 10px;">🎁 Redeem Coupon</h3>
            <input type="number" id="coupon-phone" class="input-field" placeholder="Customer Mobile Number">
            <button class="btn-3d" onclick="redeemCoupon()" style="background: linear-gradient(145deg, #ffb703, #fb8500);">
                Reset Ticks & Redeem ➔
            </button>
        </div>
    </div>

    <!-- Firebase Config aur Asli Logic -->
    <script src="firebase-config.js"></script>
    <script src="owner-logic.js"></script>
</body>
</html>
