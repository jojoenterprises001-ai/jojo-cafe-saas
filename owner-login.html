<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Login - Jojo Cafe</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  * { box-sizing: border-box; margin:0; padding:0; font-family:'Segoe UI', sans-serif; }
  body {
    background: linear-gradient(135deg,#667eea,#764ba2);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff; border-radius: 20px; padding: 35px 25px;
    width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
  }
  .card h1 { color: #667eea; margin-bottom: 5px; font-size: 26px; }
  .card p { color: #888; margin-bottom: 25px; font-size: 14px; }
  input {
    width: 100%; padding: 14px; margin-bottom: 15px;
    border: 2px solid #eee; border-radius: 10px; font-size: 16px; outline: none;
  }
  input:focus { border-color: #667eea; }
  button {
    width: 100%; padding: 14px; background: #667eea; color: #fff;
    border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  #errorMsg { color: red; font-size: 13px; margin-bottom: 10px; display:none; }
  .link { margin-top: 18px; font-size: 13px; }
  .link a { color: #667eea; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>

<div class="card">
  <h1>🏪 Owner Login</h1>
  <p>Enter your registered mobile number & password</p>
  <div id="errorMsg"></div>
  <input type="tel" id="ownerMobileInput" placeholder="10-digit Mobile Number" maxlength="10">
  <input type="password" id="ownerPasswordInput" placeholder="Password">
  <button onclick="handleOwnerLogin()">Login →</button>
  <div class="link">New cafe? <a href="owner-register.html">Register here</a></div>
</div>

<script>
function handleOwnerLogin() {
  const mobile = document.getElementById('ownerMobileInput').value.trim();
  const password = document.getElementById('ownerPasswordInput').value;
  const errorEl = document.getElementById('errorMsg');
  errorEl.style.display = 'none';

  if (!/^[0-9]{10}$/.test(mobile)) {
    errorEl.innerText = 'Enter a valid 10-digit mobile number';
    errorEl.style.display = 'block';
    return;
  }
  if (!password) {
    errorEl.innerText = 'Enter your password';
    errorEl.style.display = 'block';
    return;
  }

  const fakeEmail = mobile + '@jojocafe.app';
  const auth = firebase.auth();

  auth.signInWithEmailAndPassword(fakeEmail, password)
    .then(() => {
      localStorage.setItem('ownerMobile', mobile);
      window.location.href = 'owner-dashboard.html';
    })
    .catch((err) => {
      errorEl.innerText = 'Wrong mobile number or password';
      errorEl.style.display = 'block';
    });
}
</script>
</body>
</html>
