<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - Jojo Cafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

    <!-- Login Section -->
    <div id="loginSection" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-xl shadow-lg">
        <h2 class="text-3xl font-extrabold text-center text-red-600 mb-6">Admin Panel</h2>
        <form id="adminLoginForm" class="space-y-4">
            <input type="email" id="adminEmail" placeholder="Admin Email" required class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-red-500 focus:outline-none">
            <input type="password" id="adminPassword" placeholder="Password" required class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-red-500 focus:outline-none">
            <button type="submit" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg hover:bg-red-700 shadow-md">Secure Login</button>
        </form>
    </div>

    <!-- Dashboard Section (Login hone ke baad dikhega) -->
    <div id="dashboardSection" class="hidden max-w-4xl mx-auto mt-10">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-3xl font-extrabold text-gray-800">Control Room</h2>
                <p class="text-gray-600">Manage all Jojo Cafe clients here.</p>
            </div>
            <button id="logoutBtn" class="bg-gray-800 text-white px-5 py-2 rounded-lg font-bold hover:bg-black">Logout</button>
        </div>

        <!-- Cafes List -->
        <div class="bg-white p-6 rounded-xl shadow-lg">
            <h3 class="text-xl font-bold mb-4 border-b pb-2 text-gray-800">Registered Cafes</h3>
            <div id="cafesList" class="space-y-4">
                <p class="text-gray-500 animate-pulse">Loading cafe data...</p>
            </div>
        </div>
    </div>

    <!-- Logic File Connect -->
    <script type="module" src="admin-logic.js"></script>
</body>
</html>
