<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Your Cafe - Jojo</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
 <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  * { box-sizing: border-box; margin:0; padding:0; font-family:'Segoe UI', sans-serif; }
  body {
    background: linear-gradient(135deg,#667eea,#764ba2);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff; border-radius: 20px; padding: 35px 25px;
    width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .card h1 { color: #667eea; text-align: center; margin-bottom: 5px; font-size: 26px; }
  .card p { color: #888; text-align: center; margin-bottom: 25px; font-size: 14px; }
  label { font-size: 13px; color: #555; margin-bottom: 5px; display: block; }
  input {
    width: 100%; padding: 14px; margin-bottom: 15px;
    border: 2px solid #eee; border-radius: 10px; font-size: 16px; outline: none;
  }
  input:focus { border-color: #667eea; }
  button {
    width: 100%; padding: 14px; background: #667eea; color: #fff;
    border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  #errorMsg { color: red; font-size: 13px; margin-bottom: 10px; display:none; text-align:center; }
  .hint { font-size: 11px; color: #999; margin-top: -10px; margin-bottom: 15px; }

  /* Success popup */
  .overlay {
    display: none; position: fixed; top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 999;
  }
  .overlay.active { display: flex; }
  .popup {
    background: #fff; border-radius: 18px; padding: 30px 24px;
    width: 90%; max-width: 360px; text-align: center;
  }
  .popup h2 { color: #27ae60; margin-bottom: 10px; font-size: 20px; }
  .popup p { color: #666; font-size: 14px; margin-bottom: 20px; }
  .wa-btn {
    display: inline-block; background: #25D366; color: #fff;
    padding: 14px 24px; border-radius: 30px; text-decoration: none;
    font-weight: bold; font-size: 15px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🏪 Register Your Cafe</h1>
  <p>Get started with Jojo Cafe SaaS</p>
  <div id="errorMsg"></div>

  <label>Cafe Name</label>
  <input type="text" id="cafeName" placeholder="e.g. Sunrise Cafe">

  <label>Owner Name</label>
  <input type="text" id="ownerName" placeholder="Your full name">

  <label>Login Mobile Number</label>
  <input type="tel" id="ownerMobile" placeholder="10-digit mobile number" maxlength="10">
  <p class="hint">Use this number to login to your dashboard</p>
<label>Set a Password</label>
  <input type="password" id="ownerPassword" placeholder="Create a password (min 6 characters)">
  <label>WhatsApp Order Number</label>
  <input type="tel" id="whatsappNumber" placeholder="10-digit WhatsApp number" maxlength="10">
  <p class="hint">Customer orders will be sent to this WhatsApp number</p>

  <label>Cafe Address</label>
  <input type="text" id="cafeAddress" placeholder="City / Area">

  <button onclick="handleRegister()">Register Cafe →</button>
</div>

<!-- Success Popup with WhatsApp Activation -->
<div id="successOverlay" class="overlay">
  <div class="popup">
    <h2>✅ Registered!</h2>
    <p>Your 7-Day Free Trial request is created!<br>Click below to message Admin for activation.</p>
    <a id="waActivateBtn" href="#" target="_blank" class="wa-btn">📲 Message Admin on WhatsApp</a>
  </div>
</div>

<script src="register-db.js"></script>
</body>
</html>
