<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fce4ec; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 90%; width: 500px; margin: 40px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(233, 30, 99, 0.2); box-sizing: border-box; }
        h2, h3 { color: #e91e63; text-align: center; }
        label { color: #333; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0 20px 0; border: 1px solid #f48fb1; border-radius: 8px; box-sizing: border-box; outline: none; }
        input:focus, select:focus { border-color: #e91e63; }
        .btn-pink { background-color: #e91e63; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-pink:active { transform: scale(0.92); }
        .logout-btn { background-color: #333; padding: 8px 15px; float: right; border-radius: 5px; color: white; border: none; cursor: pointer; }
        .item-card { border: 1px solid #f8bbd0; padding: 10px; border-radius: 8px; margin-bottom: 10px; background-color: #fffafb; }
        .weight-row { display: flex; gap: 10px; }
        .weight-row div { flex: 1; }
        footer { text-align: center; padding: 20px; margin-top: auto; }
        .footer-text { color: #ff66b2; font-weight: bold; font-size: 16px; margin: 0; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        #dashboardSection { display: none; }
    </style>
</head>
<body>

    <div class="container" id="loginSection">
        <h2>दुकानदार लॉगिन</h2>
        <form id="shopLoginForm">
            <label>ईमेल आईडी</label> <input type="email" id="loginEmail" required>
            <label>पासवर्ड</label> <input type="password" id="loginPassword" required>
            <button type="submit" class="btn-pink">लॉगिन करें</button>
        </form>
    </div>

    <div class="container" id="dashboardSection">
        <button class="logout-btn" onclick="logoutShop()">Logout</button>
        <h2 id="welcomeText">डैशबोर्ड</h2>
        <hr style="border-top: 1px solid #f48fb1; margin-bottom: 20px;">

        <h3>दुकान की सेटिंग्स</h3>
        <form id="settingsForm">
            <label>पेमेंट के लिए UPI ID</label> <input type="text" id="upiId" placeholder="ex: 9876543210@ybl" required>
            <label>WhatsApp नंबर</label> <input type="tel" id="waNumber" placeholder="बिना +91 के" required>
            <button type="button" class="btn-pink" onclick="saveSettings()">सेटिंग्स सेव करें</button>
        </form>

        <hr style="border-top: 1px solid #f48fb1; margin: 30px 0;">

        <h3>नया सामान ऐड करें</h3>
        <form id="addItemForm">
            <label>सामान का नाम</label>
            <input type="text" id="itemName" placeholder="जैसे: आशीर्वाद आटा या मैगी" required>
            
            <label>कीमत (₹)</label>
            <input type="number" id="itemPrice" placeholder="कीमत डालें" required>
            
            <!-- वजन और Kg/Gm चुनने का ऑप्शन -->
            <div class="weight-row">
                <div>
                    <label>वजन</label>
                    <input type="number" step="0.01" id="itemWeight" placeholder="जैसे: 1 या 500" required>
                </div>
                <div>
                    <label>यूनिट (Kg / Gm)</label>
                    <select id="itemUnit">
                        <option value="kg">Kg (किलो)</option>
                        <option value="gm">Gm (ग्राम)</option>
                    </select>
                </div>
            </div>

            <!-- फोटो चुनने का ऑप्शन -->
            <label>सामान की फोटो चुनें (यह कस्टमर को दिखेगी)</label>
            <select id="itemImageKey">
                <optgroup label="राशन / किराना">
                    <option value="grains">आटा / चावल / मैदा / सूजी</option>
                    <option value="dal">दालें (मूंग, चना, अरहर)</option>
                    <option value="oil">तेल / रिफाइंड / घी</option>
                    <option value="tea_sugar">चीनी / चायपत्ती / कॉफी</option>
                    <option value="masala">मसाले / नमक / हल्दी</option>
                </optgroup>
                <optgroup label="स्नैक्स और ड्रिंक्स">
                    <option value="snacks">बिस्कुट / नमकीन / चिप्स / मैगी</option>
                    <option value="drinks">कोल्ड ड्रिंक / जूस / पानी</option>
                </optgroup>
                <optgroup label="डेयरी और ताज़ा">
                    <option value="dairy">दूध / दही / पनीर / अंडे</option>
                    <option value="vegetables">सब्जियां (आलू, प्याज, टमाटर)</option>
                    <option value="fruits">फल (केला, सेब, आम)</option>
                </optgroup>
                <optgroup label="सफाई और अन्य">
                    <option value="cleaning">साबुन / सर्फ / साफ़-सफाई</option>
                    <option value="personal">शैम्पू / क्रीम / तेल (बालों का)</option>
                    <option value="default">अन्य (Default Photo)</option>
                </optgroup>
            </select>
            
            <button type="submit" class="btn-pink">सामान ऐड करें</button>
        </form>

        <h3 style="margin-top: 30px;">आपकी दुकान का सामान</h3>
        <div id="itemsList"></div>
    </div>
    <footer><p class="footer-text">designed by shlok Chaudhary</p></footer>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBav2xy-Ta0ALvGBYuomsN1MqcMvQ7vcFc", authDomain: "myshop-c8141.firebaseapp.com", projectId: "myshop-c8141", storageBucket: "myshop-c8141.firebasestorage.app", messagingSenderId: "166012507213", appId: "1:166012507213:web:49b73bb01c79f6e6f2f804" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();
        let currentShopId = localStorage.getItem("shopId");
        if(currentShopId) showDashboard();

        document.getElementById('shopLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            db.collection("shops").where("email", "==", document.getElementById('loginEmail').value).where("password", "==", document.getElementById('loginPassword').value).get().then(snap => {
                if(snap.empty) alert("गलत डिटेल!");
                else snap.forEach(doc => { 
                    if(doc.data().status === "Active") { localStorage.setItem("shopId", doc.id); currentShopId = doc.id; showDashboard(); }
                    else alert("आईडी पेंडिंग या बंद है!");
                });
            });
        });

        function showDashboard() {
            document.getElementById('loginSection').style.display = 'none'; document.getElementById('dashboardSection').style.display = 'block';
            db.collection("shops").doc(currentShopId).get().then(doc => {
                document.getElementById('welcomeText').innerText = doc.data().shopName;
                if(doc.data().upiId) document.getElementById('upiId').value = doc.data().upiId;
                if(doc.data().whatsapp) document.getElementById('waNumber').value = doc.data().whatsapp;
            }); loadItems();
        }

        function saveSettings() { db.collection("shops").doc(currentShopId).update({ upiId: document.getElementById('upiId').value, whatsapp: document.getElementById('waNumber').value }).then(() => alert("सेटिंग्स सेव हो गईं!")); }

        document.getElementById('addItemForm').addEventListener('submit', function(e) {
            e.preventDefault();
            db.collection("products").add({
                shopId: currentShopId, 
                name: document.getElementById('itemName').value, 
                price: Number(document.getElementById('itemPrice').value), 
                weight: Number(document.getElementById('itemWeight').value), 
                unit: document.getElementById('itemUnit').value,
                imageKey: document.getElementById('itemImageKey').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => { alert("सामान ऐड हो गया!"); document.getElementById('addItemForm').reset(); });
        });

        function loadItems() {
            db.collection("products").where("shopId", "==", currentShopId).onSnapshot(snap => {
                let list = document.getElementById('itemsList'); list.innerHTML = "";
                snap.forEach(doc => { 
                    let item = doc.data(); 
                    let unitDisplay = item.unit ? item.unit : 'kg'; // For older items
                    list.innerHTML += `<div class="item-card"><b style="color:#e91e63;">${item.name}</b><br>💰 ₹${item.price} | ⚖️ ${item.weight} ${unitDisplay}<br><small style="color:gray;">कैटेगरी: ${item.imageKey || 'Auto'}</small><br><button onclick="db.collection('products').doc('${doc.id}').delete()" style="background:red; color:white; border:none; padding:5px; margin-top:5px; border-radius:3px;">Delete</button></div>`; 
                });
            });
        }
        function logoutShop() { localStorage.removeItem("shopId"); location.reload(); }
    </script>
</body>
</html>
