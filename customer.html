<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>दुकान का मेन्यू</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fce4ec; margin: 0; padding: 0; padding-bottom: 100px; }
        .header { background-color: #e91e63; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .container { max-width: 600px; margin: 20px auto; padding: 10px; }
        .product-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; box-shadow: 0 3px 10px rgba(233, 30, 99, 0.15); }
        .product-img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; margin-right: 15px; border: 1px solid #f8bbd0; }
        .product-info { flex-grow: 1; }
        .product-title { color: #e91e63; font-size: 16px; font-weight: bold; margin: 0 0 5px 0; }
        .product-price { color: #333; font-size: 14px; margin: 0; }
        .btn-pink { background-color: #e91e63; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-pink:active { transform: scale(0.90); }
        .checkout-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 15px; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; z-index: 1000; }
        #checkoutModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 90%; max-width: 400px; z-index: 2000; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #f48fb1; border-radius: 6px; box-sizing: border-box; outline: none; }
        .overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 1500; }
        
        /* नया UPI बॉक्स डिज़ाइन */
        #upiInfoBox { background: #e8f5e9; border: 1px dashed #4CAF50; padding: 10px; text-align: center; border-radius: 8px; margin-bottom: 10px; display: none; }
        footer { text-align: center; padding: 20px; margin-top: auto; }
        .footer-text { color: #ff66b2; font-weight: bold; font-size: 16px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="header" id="shopHeader">दुकान का मेन्यू</div>
    <div class="container" id="menuList"><h3 style="text-align: center; color: #888;">लोड हो रहा है...</h3></div>

    <div class="checkout-bar" id="cartBar" style="display: none;">
        <div><b style="color: #e91e63; font-size: 16px;">कुल: ₹<span id="cartTotal">0</span></b><br><small>वजन: <span id="cartWeight">0</span> Kg</small></div>
        <button class="btn-pink" style="padding: 12px 20px;" onclick="openCheckout()">चेकआउट करें ➔</button>
    </div>

    <div class="overlay" id="overlay"></div>

    <div id="checkoutModal">
        <h2 style="color: #e91e63; text-align: center; margin-top: 0;">डिलीवरी डिटेल्स</h2>
        <label><b>आपका नाम</b></label> <input type="text" id="custName" required>
        <label><b>गाँव / मोहल्ले का नाम 📍</b></label> <input type="text" id="custVillage" required>
        <label><b>पेमेंट का तरीका</b></label>
        <select id="paymentMode" onchange="checkPaymentMode()">
            <option value="COD (Cash on Delivery)">Cash on Delivery (घर पर पैसे दें)</option>
            <option value="Online (UPI)">Online Payment (UPI/QR)</option>
        </select>
        
        <!-- यहीं दिखेगी दुकानदार की UPI ID -->
        <div id="upiInfoBox"></div>

        <button class="btn-pink" style="width: 100%; background-color: #25D366;" onclick="placeOrder()">WhatsApp पर ऑर्डर भेजें</button>
        <button class="btn-pink" style="width: 100%; margin-top: 10px; background-color: #aaa;" onclick="closeCheckout()">वापस जाएँ</button>
    </div>
    <footer><p class="footer-text">designed by shlok Chaudhary</p></footer>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBav2xy-Ta0ALvGBYuomsN1MqcMvQ7vcFc", authDomain: "myshop-c8141.firebaseapp.com", projectId: "myshop-c8141", storageBucket: "myshop-c8141.firebasestorage.app", messagingSenderId: "166012507213", appId: "1:166012507213:web:49b73bb01c79f6e6f2f804" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        let cart = [], shopWhatsApp = "", shopUpi = "सेट नहीं है";

        // एकदम सटीक भारतीय किराने की फोटोज
        const photoLibrary = {
            "grains": "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=200", // आटा/चावल/दाल
            "oil": "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=200", // तेल
            "masala": "https://images.unsplash.com/photo-1596040033229-a9821ebd058d?w=200", // मसाले
            "dairy": "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=200", // दूध/डेयरी
            "snacks": "https://images.unsplash.com/photo-1599490659213-e2b9527bd087?w=200", // स्नैक्स
            "drinks": "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=200", // कोल्ड ड्रिंक
            "cleaning": "https://images.unsplash.com/photo-1584820927498-cafe5c152a4e?w=200", // साबुन/सर्फ
            "personal": "https://images.unsplash.com/photo-1629198688000-71f23e745b6e?w=200", // शैम्पू/क्रीम
            "vegetables": "https://images.unsplash.com/photo-1518843875459-f738682238a6?w=200", // सब्जी
            "fruits": "https://images.unsplash.com/photo-1610832958506-aa56368176cf?w=200", // फल
            "default": "https://images.unsplash.com/photo-1578916171728-46686eac8d58?w=200" // अन्य
        };

        function loadProducts() {
            db.collection("products").get().then((snap) => {
                let menu = document.getElementById('menuList'); menu.innerHTML = "";
                if(snap.empty) { menu.innerHTML = "<h3>कोई सामान नहीं है।</h3>"; return; }
                snap.forEach(doc => {
                    let item = doc.data();
                    let imgUrl = photoLibrary[item.category] || photoLibrary["default"];
                    menu.innerHTML += `
                        <div class="product-card">
                            <img src="${imgUrl}" class="product-img">
                            <div class="product-info">
                                <h4 class="product-title">${item.name}</h4>
                                <p class="product-price">₹${item.price} <small>(${item.weight}Kg)</small></p>
                            </div>
                            <button class="btn-pink" onclick="addToCart('${doc.id}', '${item.name}', ${item.price}, ${item.weight})">+ Add</button>
                        </div>`;
                    getShopDetails(item.shopId);
                });
            });
        }

        function getShopDetails(shopId) {
            db.collection("shops").doc(shopId).get().then(doc => {
                if(doc.exists) { 
                    shopWhatsApp = doc.data().whatsapp; 
                    if(doc.data().upiId) shopUpi = doc.data().upiId;
                    document.getElementById('shopHeader').innerText = doc.data().shopName + " - मेन्यू"; 
                }
            });
        }

        function addToCart(id, name, price, weight) {
            let existing = cart.find(i => i.id === id);
            if(existing) existing.qty += 1; else cart.push({ id, name, price, weight, qty: 1 });
            updateCartUI();
        }

        function updateCartUI() {
            if(cart.length > 0) document.getElementById('cartBar').style.display = 'flex';
            let tRs = 0, tWt = 0;
            cart.forEach(i => { tRs += i.price * i.qty; tWt += i.weight * i.qty; });
            document.getElementById('cartTotal').innerText = tRs;
            document.getElementById('cartWeight').innerText = tWt.toFixed(2);
        }

        function calculateDelivery(w) { return w<=5?29 : w<=10?39 : w<=20?45 : w<=50?75 : 129; }
        
        function openCheckout() { document.getElementById('overlay').style.display = 'block'; document.getElementById('checkoutModal').style.display = 'block'; }
        function closeCheckout() { document.getElementById('overlay').style.display = 'none'; document.getElementById('checkoutModal').style.display = 'none'; }

        // ऑनलाइन सेलेक्ट करने पर UPI ID दिखाना
        function checkPaymentMode() {
            let mode = document.getElementById('paymentMode').value;
            let upiBox = document.getElementById('upiInfoBox');
            if(mode.includes("Online")) {
                upiBox.innerHTML = `<b>दुकानदार की UPI ID:</b><br><span style="color:#e91e63; font-size:18px;">${shopUpi}</span><br><small style="color:#333;">पेमेंट करके WhatsApp पर स्क्रीनशॉट भेजें</small>`;
                upiBox.style.display = "block";
            } else {
                upiBox.style.display = "none";
            }
        }

        function placeOrder() {
            let name = document.getElementById('custName').value, village = document.getElementById('custVillage').value, payment = document.getElementById('paymentMode').value;
            if(!name || !village) { alert("नाम और गाँव भरें!"); return; }
            let btn = document.querySelector("#checkoutModal .btn-pink"); btn.innerText = "लोकेशन ले रहा है..."; btn.disabled = true;
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => sendWhatsAppMessage(name, village, payment, pos.coords.latitude, pos.coords.longitude), 
                    err => sendWhatsAppMessage(name, village, payment, "Not Provided", "Not Provided")
                );
            } else sendWhatsAppMessage(name, village, payment, "Not Supported", "Not Supported");
        }

        function sendWhatsAppMessage(name, village, payment, lat, lng) {
            let tWt = 0, itemTotal = 0, listTxt = "";
            cart.forEach((i, idx) => { listTxt += `${idx+1}. ${i.name} (x${i.qty}) - ₹${i.price * i.qty}\n`; tWt += i.weight * i.qty; itemTotal += i.price * i.qty; });
            let dCharge = calculateDelivery(tWt), finalBill = itemTotal + dCharge;
            let mapLink = (lat !== "Not Provided") ? `https://www.google.com/maps?q=${lat},${lng}` : "लोकेशन नहीं मिली";
            
            let message = `🚨 *नया ऑर्डर प्राप्त हुआ!* 🚨\n\n👤 *नाम:* ${name}\n📍 *गाँव:* ${village}\n🔗 *लोकेशन:* ${mapLink}\n\n--- *सामान की लिस्ट* ---\n${listTxt}\n⚖️ *वजन:* ${tWt.toFixed(2)} Kg\n🚚 *डिलीवरी:* ₹${dCharge}\n💰 *कुल बिल:* ₹${finalBill}\n💳 *पेमेंट:* ${payment}`;
            if(payment.includes("Online")) message += `\n\n*मैंने ${shopUpi} पर पेमेंट कर दिया है, स्क्रीनशॉट भेज रहा हूँ।*`;

            window.open(`https://wa.me/91${shopWhatsApp}?text=${encodeURIComponent(message)}`, "_blank");
            closeCheckout(); let btn = document.querySelector("#checkoutModal .btn-pink"); btn.innerText = "WhatsApp पर ऑर्डर भेजें"; btn.disabled = false;
        }
        window.onload = loadProducts;
    </script>
</body>
    </html>
