<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOJO Games & Leaderboard</title>
    <style>
        /* Premium JOJO Games UI */
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; margin: 0; padding: 0; }
        
        .header { background: #ff4757; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: sticky; top: 0; }
        .header-btn { cursor: pointer; font-weight: bold; font-size: 16px; background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 8px;}
        
        .container { padding: 20px; max-width: 500px; margin: auto; }
        
        .game-btn { width: 100%; padding: 18px; margin-bottom: 15px; background: #fff; border: 2px solid #ddd; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
        .game-btn:active { transform: scale(0.96); border-color: #ff4757; }
        .pts-tag { color: #ff4757; background: #ffeaa7; padding: 3px 8px; border-radius: 6px; font-size: 14px;}
        
        .game-section { display: none; background: #fff; padding: 25px 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-top: 10px; text-align: center; }
        
        /* Tic Tac Toe */
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 280px; margin: 20px auto; }
        .cell { height: 80px; background: #f1f2f6; display: flex; align-items: center; justify-content: center; font-size: 45px; font-weight: bold; cursor: pointer; border-radius: 10px; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.1); }
        
        /* Quiz */
        .quiz-opts button { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #dfe4ea; border-radius: 8px; background: #fff; font-size: 16px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .quiz-opts button:active { background: #dfe4ea; }
        
        /* Leaderboard */
        .leaderboard-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #f1f2f6; font-size: 16px; font-weight: 500;}
        .leaderboard-item:nth-child(1) { background: #fff20020; border-radius: 8px; font-weight: bold;}
        
        .action-btn { background: #2ed573; color: white; padding: 12px 20px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
        .action-btn.red { background: #ff4757; }
    </style>
</head>
<body>

    <!-- Header (Points Top Right) -->
    <div class="header">
        <span class="header-btn" onclick="window.location.href='customer-dashboard.html'">🔙 Menu</span>
        <span style="font-weight: bold; font-size: 18px;">JOJO Zone</span>
        <span class="header-btn" id="userPoints">🏆 0 Pts</span>
    </div>
    
    <!-- Main Games Menu -->
    <div class="container" id="mainMenu">
        <h3 style="text-align: center; color: #333; margin-bottom: 25px;">Play Games & Top the Leaderboard!</h3>
        
        <button class="game-btn" onclick="openGame('quizSection')">
            <span>🧠 Daily GK Quiz</span> <span class="pts-tag">+10 Pts</span>
        </button>
        
        <button class="game-btn" onclick="openGame('tictactoeSection')">
            <span>❌⭕ Tic-Tac-Toe</span> <span class="pts-tag">+20 Pts</span>
        </button>
        
        <button class="game-btn" onclick="openGame('leaderboardSection'); loadLeaderboard();" style="border-color:#2ed573;">
            <span>🏆 Live Leaderboard</span> <span class="pts-tag" style="background:#2ed573; color:white;">Top 10</span>
        </button>
    </div>

    <!-- 🧠 Quiz Section -->
    <div class="container game-section" id="quizSection">
        <h3 id="questionText" style="color: #2f3542;">Loading Question...</h3>
        <p style="color: #ff4757; font-weight: bold; font-size: 18px;">⏱️ Timer: <span id="timeRemaining">15</span>s</p>
        <div id="quizOptions" class="quiz-opts"></div>
        <button class="action-btn red" onclick="closeGame()">Cancel</button>
    </div>

    <!-- ❌⭕ Tic Tac Toe Section -->
    <div class="container game-section" id="tictactoeSection">
        <h3 style="margin-top: 0;">Play against JOJO AI</h3>
        <div class="board" id="tttBoard"></div>
        <button class="action-btn" onclick="initTicTacToe()">🔄 Restart Game</button>
        <button class="action-btn red" onclick="closeGame()">🔙 Back</button>
    </div>

    <!-- 🏆 Leaderboard Section -->
    <div class="container game-section" id="leaderboardSection">
        <h3 style="margin-top: 0;">🏆 JOJO Leaderboard</h3>
        <div id="leaderboardList" style="text-align: left; margin-bottom: 20px;">Loading top players... ⏳</div>
        <button class="action-btn red" onclick="closeGame()">🔙 Back to Games</button>
    </div>

    <!-- Firebase SDK (ये लिंक्स वही हैं जो आपके प्रोजेक्ट में यूज़ हो रहे हैं) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- आपकी Firebase Config फाइल -->
    <script src="firebase-config.js"></script>
    <!-- हमारा नया गेम्स लॉजिक -->
    <script src="games.js"></script>
</body>
</html>
